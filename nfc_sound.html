<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔊 Звук</title>
<style>
  body{font-family:system-ui,sans-serif;text-align:center;padding:45px 20px;background:#f5f5f5}
  button{font-size:24px;padding:18px 30px;border:0;border-radius:16px;cursor:pointer}
  p{font-size:17px}
</style>
</head>
<body>
  <h1>🔊 Увімкнути звук</h1>
  <p>Натисни кнопку, щоб відтворити звук.</p>
  <button id="play">▶️ Увімкнути звук</button>

<script>
document.getElementById("play").addEventListener("click", async () => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  if (ctx.state === "suspended") await ctx.resume();

  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();

  osc.type = "square";
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.setValueAtTime(660, now + 0.18);
  osc.frequency.setValueAtTime(880, now + 0.36);

  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
  gain.gain.setValueAtTime(0.35, now + 0.18);
  gain.gain.setValueAtTime(0.001, now + 0.20);
  gain.gain.exponentialRampToValueAtTime(0.35, now + 0.38);
  gain.gain.setValueAtTime(0.001, now + 0.60);

  osc.connect(gain).connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.62);
});
</script>
</body>
</html>
